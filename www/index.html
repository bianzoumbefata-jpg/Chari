function startVideoCall(id){
const p=byId(id);if(!p)return;
if(!(st.mt||[]).includes(id)){
alert(x().onlyMatchedCanChat||"Vous devez être en match pour pouvoir vous appeler.");
return;
}
callState.active=true;
callState.status="ringing";
callState.targetId=id;
callState.sec=0;
callState.micOn=true;
callState.camOn=true;
renderCallOverlay();
startOutgoingPhoneRingtone();

clearTimeout(callState.connectTimeout);
callState.connectTimeout=setTimeout(()=>{
if(!callState.active)return;
stopPhoneRingtone();
callState.status="connected";
renderCallOverlay();

if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:640},height:{ideal:480}},audio:true})
.then(s=>{
callState.stream=s;
const v=$("#call-self-video");if(v){v.srcObject=s;v.play().catch(()=>{});}
}).catch(err=>{console.warn("Media error:",err);});
}

clearInterval(callState.timer);
callState.timer=setInterval(()=>{
callState.sec++;
const min=Math.floor(callState.sec/60).toString().padStart(2,"0"),s=(callState.sec%60).toString().padStart(2,"0");
const disp=$("#call-timer-display");if(disp)disp.textContent=`${min}:${s}`;
},1000);
},4500);
}

function stopVideoCall(){
if(!callState.active)return;
clearTimeout(callState.connectTimeout);
stopPhoneRingtone();
playHangupTone();
const tid=callState.targetId,dur=callState.sec;
clearInterval(callState.timer);
if(callState.stream){callState.stream.getTracks().forEach(tr=>tr.stop());callState.stream=null}
callState.active=false;
callState.status="idle";
const ov=$("#call-ov");if(ov)ov.remove();
if(tid){
const min=Math.floor(dur/60).toString().padStart(2,"0"),s=(dur%60).toString().padStart(2,"0");
add(tid,{w:"sys",t:`📹 ${x().callEnd} (${min}:${s})`});
}
}

function handleDirectMediaUpload(file){

alert(st.lang==="ar"?"الحد الأقصى 5 صور أو مقاطع فيديو":"Vous avez atteint la limite de 5 photos ou vidéos.");
return;
}
const isVid = file.type.startsWith("video/") || /\.(mp4|webm|mov|m4v)$/i.test(file.name);
if(isVid){
handleVideoUpload(file);
}else{
handlePhotoUpload(file);
}
}
const handleDirectPhotoUpload = handleDirectMediaUpload;

function handlePhotoUpload(file){
const reader=new FileReader();
reader.onload=function(ev){
const img=new Image();
img.onload=function(){
const maxDim=800;
let w=img.width,h=img.height;
if(w>maxDim||h>maxDim){
if(w>h){h=Math.round((h*maxDim)/w);w=maxDim;}
else{w=Math.round((w*maxDim)/h);h=maxDim;}
}
const canvas=document.createElement("canvas");
canvas.width=w;canvas.height=h;
const ctx=canvas.getContext("2d");
ctx.drawImage(img,0,0,w,h);
const dataUrl=canvas.toDataURL("image/jpeg",0.85);
st.ph5.push({o:dataUrl,p:dataUrl,isSelfie:false});
save();
syncProfileToSupabase();
render();
};
img.src=ev.target.result;
};
reader.readAsDataURL(file);
}

function handleVideoUpload(file){
const objUrl = URL.createObjectURL(file);
const video = document.createElement("video");
video.preload = "metadata";
video.src = objUrl;
video.muted = true;
video.playsInline = true;

let processed = false;
const finishUpload = (posterDataUrl, durSec) => {
if(processed) return;
processed = true;
const reader = new FileReader();
reader.onload = async function(ev){
const videoDataUrl = ev.target.result;
let finalVideoUrl = videoDataUrl;
if(sbClient){
try{
const ext = file.name.split('.').pop() || 'mp4';
const up = await uploadMediaToSupabase(videoDataUrl, `video_${st.u.id||'u'}_${Date.now()}.${ext}`, file.type || 'video/mp4');
if(up && !up.startsWith("data:")) finalVideoUrl = up;
}catch(err){console.warn("Video Supabase upload:", err);}
}
st.ph5.push({
o: finalVideoUrl,
p: finalVideoUrl,
poster: posterDataUrl,
isVideo: true,
duration: durSec || 10,
isSelfie: false
});
URL.revokeObjectURL(objUrl);
save();
syncProfileToSupabase();
render();
say(st.lang === "ar" ? "تمت إضافة الفيديو بنجاح (10 ثوانٍ) 🎥" : "Vidéo de 10s ajoutée avec succès 🎥");
};
reader.readAsDataURL(file);
};

video.onloadedmetadata = function(){
const dur = video.duration || 0;
if(dur > 10.5){
URL.revokeObjectURL(objUrl);
const msg = st.lang === "ar"
? `عذراً، يجب ألا تتجاوز مدة الفيديو 10 ثوانٍ (مدة هذا الفيديو: ${Math.round(dur)} ثانية). يرجى اختيار فيديو أقصر.`
: `La vidéo ne doit pas dépasser 10 secondes (durée : ${Math.round(dur)}s). Veuillez sélectionner une vidéo de 10 secondes maximum.`;
alert(msg);
return;
}
const seekTo = Math.min(1.0, dur > 1 ? dur / 2 : 0.2);
video.currentTime = seekTo;
};

video.onseeked = function(){
try{
const maxDim = 640;
let w = video.videoWidth || 480;
let h = video.videoHeight || 640;
if(w > maxDim || h > maxDim){
if(w > h){ h = Math.round((h * maxDim) / w); w = maxDim; }
else { w = Math.round((w * maxDim) / h); h = maxDim; }
}
const canvas = document.createElement("canvas");
canvas.width = w; canvas.height = h;
const ctx = canvas.getContext("2d");
ctx.drawImage(video, 0, 0, w, h);
const poster = canvas.toDataURL("image/jpeg", 0.85);
finishUpload(poster, Math.round(video.duration || 10));
}catch(err){
finishUpload("couple.jpg", Math.round(video.duration || 10));
}
};

video.onerror = function(){
URL.revokeObjectURL(objUrl);
alert(st.lang === "ar" ? "تعذر قراءة ملف الفيديو." : "Impossible de lire le fichier vidéo.");
};

setTimeout(()=>{
if(!processed && video.readyState >= 1){
finishUpload("couple.jpg", Math.round(video.duration || 10));
}
}, 3500);
}

if(e.key==="Enter"&&e.target&&e.target.id==="in"){
e.preventDefault();
send();
return;
}
if(e.key==="PrintScreen"){e.preventDefault();triggerScreenshotBlocked();return}
const ctrl=e.ctrlKey||e.metaKey;
if(ctrl&&(e.key==="p"||e.key==="P"||e.key==="s"||e.key==="S")){e.preventDefault();triggerScreenshotBlocked();return}
if(ctrl&&e.shiftKey&&(e.key==="s"||e.key==="S"||e.key==="i"||e.key==="I")){e.preventDefault();triggerScreenshotBlocked();return}
if(e.key==="F12"){e.preventDefault();return}
});

document.addEventListener("pointerdown",e=>{
const btn=e.target&&e.target.closest&&e.target.closest("#btn-rec, [data-a='chat-rec']");
if(btn){
e.preventDefault();
startVoiceHold(btn);
}
});
document.addEventListener("pointerup",()=>{
if(recState.holdActive){
endVoiceHold(false);
}
});
document.addEventListener("pointercancel",()=>{
if(recState.holdActive){
endVoiceHold(true);
}
});
document.addEventListener("touchstart",e=>{
const btn=e.target&&e.target.closest&&e.target.closest("#btn-rec, [data-a='chat-rec']");
if(btn){
e.preventDefault();
if(!recState.holdActive)startVoiceHold(btn);
}
},{passive:false});
document.addEventListener("touchend",e=>{
if(recState.holdActive){
e.preventDefault();
endVoiceHold(false);
}
},{passive:false});

endVoiceHold(true);
}
});
// Screenshot protection on explicit key triggers only
window.addEventListener("focus",()=>{document.body.classList.remove("screen-protected")});
// Contenu flouté quand l'app passe en arrière-plan (aperçu du sélecteur d'applications)
document.addEventListener("visibilitychange",()=>{document.body.classList.toggle("privacy-blur",document.hidden)});
window.addEventListener("blur",()=>{if(st.step>=5)document.body.classList.add("privacy-blur")});
window.addEventListener("focus",()=>{document.body.classList.remove("privacy-blur")});
render();
let authListenerAttached=false;
async function handleUserAuthSession(session){
try{localStorage.removeItem("chari_admin_login");}catch(e){}
if(!session||!session.user){
if(st.step>=2){
currentActiveUserKey=null;
try{localStorage.removeItem("chari_active_key");}catch(e){}
const blank=createBlankState();
for(let k in blank)st[k]=blank[k];
st.step=0;
render();
}
return;
}
const u=session.user;
const meta=u.user_metadata||{};
const gEmail=(u.email||"").trim().toLowerCase();
const gName=meta.full_name||meta.name||"";
const uid=u.id;
if(handleUserAuthSession.lastUid===uid&&st.step>=2&&st.u&&st.u.id===uid)return;
handleUserAuthSession.lastUid=uid;
const targetKey=getUserKey(uid,gEmail);
if(window.location&&window.location.hash&&window.location.hash.includes('access_token')){
try{history.replaceState(null,null,window.location.pathname+window.location.search);}catch(e){}
}
currentActiveUserKey=targetKey;
try{localStorage.setItem("chari_active_key",targetKey);}catch(e){}
/* Preferences locales (langue, quotas du jour) */
let saved=null;
try{const raw=localStorage.getItem(targetKey);if(raw)saved=JSON.parse(raw);}catch(e){}
const blank=createBlankState(gEmail,uid,gName);
for(let k in blank)st[k]=blank[k];
if(saved){
["lang","blur","lite","mSubTab","reqSubTab","passed","blocked","sentRequests","incomingRequests","mt","ms","theme","filters","actTab"].forEach(k=>{if(k in saved)st[k]=saved[k]});
const todayKey=getChadDateKey();
if(saved.dailyLimits&&saved.dailyLimits.date===todayKey){st.dailyLimits=saved.dailyLimits;st.seen=saved.dailyLimits.seen||0;}
}
st.u.id=uid;st.em=gEmail;st.mode=(u.app_metadata&&u.app_metadata.provider)||"email";st.u.gVerif=st.mode==="google";
const mine=await loadMyProfileFromSupabase();
if(mine){
applyMyProfile(mine);
}else if(saved&&saved.u&&saved.u.n){
/* Inscription commencee sur cet appareil mais pas encore enregistree */
st.u=Object.assign({},st.u,saved.u,{id:uid});st.g=saved.g||st.g;st.selfie=saved.selfie||"";st.ph5=saved.ph5||[];
}
checkAndResetDailyLimits();
initIncomingRequests();
if(isProfileComplete(st)&&hasVerifiedSelfie(st)){
st.step=5;st.savedStep=5;st.tab=st.tab||"d";
save();go(5);
loadBlockedUsersFromSupabase();loadLikesAndMatchesFromSupabase().then(loadProfilesFromSupabase).then(loadActivity);
}else if(isProfileComplete(st)){
st.step=3;st.savedStep=3;save();go(3);
}else{
st.step=2;st.savedStep=2;save();go(2,"#nm");
say(st.lang==="ar"?"مرحباً! أكمل ملفك للبدء.":"Bienvenue ! Complétez votre profil pour commencer.");
}
}

async function checkAndExchangeUrlAuth(){
if(!sbClient||!sbClient.auth)return;
try{
const searchParams=new URLSearchParams(window.location.search);
const hashStr=window.location.hash.startsWith('#')?window.location.hash.slice(1):window.location.hash;
const hashParams=new URLSearchParams(hashStr);

const errDesc=searchParams.get('error_description')||hashParams.get('error_description')||searchParams.get('error')||hashParams.get('error');
if(errDesc){
console.warn("OAuth redirect error:",errDesc);
alert((st.lang==="ar"?"تعذر إتمام الدخول بـ Google: ":"Erreur Google OAuth : ")+decodeURIComponent(errDesc.replace(/\+/g,' ')));
go(0, "#em");
return;
}

if(searchParams.get('auth')==='google'||searchParams.get('step')==='google'||searchParams.get('step')==='1'||hashStr==='google'){
go(0, "#em");
return;
}
if(searchParams.get('step')==='2'||searchParams.get('step')==='register'||searchParams.get('step')==='inscription'||searchParams.get('register')==='1'||searchParams.get('inscription')==='1'||hashStr==='register'||hashStr==='inscription'||hashStr==='step2'){
go(2, "#nm");
return;
}

const authCode=searchParams.get('code');
if(authCode){
const {data,error}=await sbClient.auth.exchangeCodeForSession(authCode);
if(!error&&data&&data.session){
try{history.replaceState(null,null,window.location.pathname);}catch(e){}
await handleUserAuthSession(data.session);
return;
}else if(error){
console.warn("exchangeCodeForSession error:",error);
}
}

const accessToken=hashParams.get('access_token');
if(accessToken){
const refreshToken=hashParams.get('refresh_token')||"";
const {data,error}=await sbClient.auth.setSession({
access_token:accessToken,
refresh_token:refreshToken
});
if(!error&&data&&data.session){
try{history.replaceState(null,null,window.location.pathname);}catch(e){}
await handleUserAuthSession(data.session);
return;
}
}
}catch(e){
console.warn("checkAndExchangeUrlAuth catch:",e);
}
}

function initSocialAuthListener(){
if(!sbClient||authListenerAttached)return;
authListenerAttached=true;
try{
sbClient.auth.onAuthStateChange(async(evt,session)=>{
if(evt==="SIGNED_IN"||evt==="INITIAL_SESSION"||evt==="USER_UPDATED"){
await handleUserAuthSession(session);
}else if(evt==="SIGNED_OUT"){
await handleUserAuthSession(null);
}
});

checkAndExchangeUrlAuth();

sbClient.auth.getSession().then(async({data:{session}})=>{
if(session&&session.user){
await handleUserAuthSession(session);
}
}).catch(()=>{});
}catch(e){console.warn("Auth init error:",e)}
}
let realtimeChannel=null;
function initRealtimeDatabaseSync(){
if(!sbClient||!sbClient.channel||realtimeChannel)return;
try{
realtimeChannel=sbClient.channel('chari-realtime-sync')
.on('postgres_changes',{event:'*',schema:'public',table:'messages'},payload=>{
const m=payload.new||payload.old;
if(m){
const myId=st.u&&st.u.id;
const otherId=(m.sender_id===myId)?m.receiver_id:m.sender_id;
if(otherId){
loadMessagesFromSupabase(otherId);
}
if(st.tab==='m'&&!st.chat)render();
}
})
.on('postgres_changes',{event:'*',schema:'public',table:'likes'},payload=>{
loadLikesAndMatchesFromSupabase();
})
.on('postgres_changes',{event:'*',schema:'public',table:'user_blocks'},payload=>{
loadBlockedUsersFromSupabase();
})
.on('postgres_changes',{event:'*',schema:'public',table:'reveals'},payload=>{
loadProfilesFromSupabase();
})
.subscribe((status)=>{
console.log("Supabase Realtime status:",status);
});
}catch(e){console.warn("Realtime error:",e)}
}

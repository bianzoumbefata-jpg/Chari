<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chari · Rencontres au Tchad</title>

<!-- PWA & Mobile Meta Tags -->
<meta name="theme-color" content="#12307A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chari">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{
  /* Figma Mobile Apps Prototyping Kit - Tokens officiels */
  --highlight-darkest: #006FFD;
  --highlight-dark: #2897FF;
  --highlight-medium: #6FBAFF;
  --highlight-light: #B4DBFF;
  --highlight-lightest: #EAF2FF;

  --neutral-dark-darkest: #1F2024;
  --neutral-dark-dark: #2F3036;
  --neutral-dark-medium: #494A50;
  --neutral-dark-light: #71727A;
  --neutral-dark-lightest: #8F9098;

  --neutral-light-darkest: #C5C6CC;
  --neutral-light-dark: #D4D6DD;
  --neutral-light-medium: #E8E9F1;
  --neutral-light-light: #F8F9FE;
  --neutral-light-lightest: #FFFFFF;

  --support-success-dark: #298267;
  --support-success-medium: #3AC0A0;
  --support-success-light: #E7F4E8;

  --support-warning-dark: #E86339;
  --support-warning-medium: #FFB37C;
  --support-warning-light: #FFF4E4;

  --support-error-dark: #ED3241;
  --support-error-medium: #FF616D;
  --support-error-light: #FFE2E5;

  /* Mappings semantiques Figma Kit */
  --bg: var(--neutral-light-light);
  --surf: var(--neutral-light-lightest);
  --ink: var(--neutral-dark-darkest);
  --body: var(--neutral-dark-dark);
  --mut: var(--neutral-dark-light);
  --brand: var(--highlight-darkest);
  --brand-light: var(--highlight-dark);
  --brand-grad: linear-gradient(135deg, #006FFD 0%, #2897FF 100%);
  --onb: #FFFFFF;
  --gold: #F59E0B;
  --gold-bg: #FEF3C7;
  --gold-grad: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
  --heart: #ED3241;
  --heart-grad: linear-gradient(135deg, #FF616D 0%, #ED3241 100%);
  --heart-shadow: rgba(237, 50, 65, 0.35);
  --onh: #FFFFFF;
  --line: var(--neutral-light-medium);
  --ring: rgba(0, 111, 253, 0.25);
  --hdr: var(--neutral-light-lightest);
  --sh-sm: 0 1px 3px rgba(31, 32, 36, 0.05), 0 1px 2px rgba(31, 32, 36, 0.03);
  --sh-md: 0 6px 16px rgba(31, 32, 36, 0.06), 0 2px 4px rgba(31, 32, 36, 0.03);
  --sh-lg: 0 16px 36px rgba(31, 32, 36, 0.08), 0 4px 12px rgba(31, 32, 36, 0.04);
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg: #141517;
    --surf: #1F2024;
    --ink: #F8F9FE;
    --body: #D4D6DD;
    --mut: #8F9098;
    --brand: #2897FF;
    --brand-light: #6FBAFF;
    --brand-grad: linear-gradient(135deg, #006FFD 0%, #2897FF 100%);
    --onb: #FFFFFF;
    --gold: #FBBF24;
    --gold-bg: rgba(251, 191, 36, 0.15);
    --gold-grad: linear-gradient(135deg, #FBBF24 0%, #F59E0B 100%);
    --heart: #FF616D;
    --heart-grad: linear-gradient(135deg, #FF616D 0%, #ED3241 100%);
    --heart-shadow: rgba(237, 50, 65, 0.4);
    --line: #2F3036;
    --ring: rgba(40, 151, 255, 0.35);
    --hdr: #1F2024;
    --sh-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
    --sh-md: 0 6px 16px rgba(0, 0, 0, 0.35);
    --sh-lg: 0 16px 36px rgba(0, 0, 0, 0.45);
  }
}
:root[data-theme="dark"]{
  --bg: #141517;
  --surf: #1F2024;
  --ink: #F8F9FE;
  --body: #D4D6DD;
  --mut: #8F9098;
  --brand: #2897FF;
  --brand-light: #6FBAFF;
  --brand-grad: linear-gradient(135deg, #006FFD 0%, #2897FF 100%);
  --onb: #FFFFFF;
  --gold: #FBBF24;
  --gold-bg: rgba(251, 191, 36, 0.15);
  --gold-grad: linear-gradient(135deg, #FBBF24 0%, #F59E0B 100%);
  --heart: #FF616D;
  --heart-grad: linear-gradient(135deg, #FF616D 0%, #ED3241 100%);
  --heart-shadow: rgba(237, 50, 65, 0.4);
  --line: #2F3036;
  --ring: rgba(40, 151, 255, 0.35);
  --hdr: #1F2024;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{
  background: var(--bg);
  color: var(--body);
  font: 400 15px/1.5 "Inter", "IBM Plex Sans Arabic", system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.01em;
}
h1,h2,h3{
  color: var(--ink);
  font-family: "Inter", "IBM Plex Sans Arabic", system-ui, sans-serif;
  margin: 0;
  line-height: 1.25;
}
h1{font-weight: 800; font-size: 26px; letter-spacing: -0.025em}
h2{font-weight: 700; font-size: 20px; letter-spacing: -0.02em}
h3{font-weight: 700; font-size: 15px}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
header :focus-visible,.ov :focus-visible{outline-color:var(--brand-light)}
.app{
  height: 100%;
  display: flex;
  flex-direction: column;
  max-width: 480px;
  margin: 0 auto;
  box-shadow: 0 0 50px rgba(31, 32, 36, 0.08);
  background: var(--bg);
}
header{
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  background: var(--hdr);
  color: var(--ink);
  border-bottom: 1px solid var(--line);
  box-shadow: var(--sh-sm);
  z-index: 10;
}
.logo{
  font-family: "Inter", "IBM Plex Sans Arabic", system-ui, sans-serif;
  font-size: 24px;
  font-weight: 800;
  letter-spacing: -0.03em;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 6px;
}
.logo::after{
  content: "";
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--brand);
}
.lg{
  min-height: 36px;
  padding: 0 14px;
  border-radius: 999px;
  border: 1.5px solid var(--highlight-light);
  background: var(--highlight-lightest);
  color: var(--highlight-darkest);
  font-weight: 600;
  font-size: 12px;
  transition: all .18s;
  letter-spacing: 0.01em;
}
.lg:hover{
  background: #dbeafe;
  border-color: var(--brand);
}
.strip{
  height: 3px;
  flex: none;
  background: var(--brand-grad);
}
main{flex:1;min-height:0;overflow:auto;padding:18px}
nav{
  display: flex;
  border-top: 1px solid var(--line);
  background: var(--surf);
  box-shadow: 0 -4px 18px rgba(31, 32, 36, 0.04);
  min-height: 64px;
  position: relative;
  z-index: 5;
}
nav button{
  flex: 1;
  min-height: 64px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  border: 0;
  background: none;
  color: var(--neutral-dark-lightest);
  font-size: 11px;
  font-weight: 600;
  transition: all .2s;
  position: relative;
  letter-spacing: 0.01em;
}
nav button:hover{color: var(--ink)}
nav [aria-current]{color: var(--brand); font-weight: 700}
nav [aria-current]::after{
  content: "";
  position: absolute;
  top: 0;
  width: 28px;
  height: 3px;
  border-radius: 0 0 4px 4px;
  background: var(--brand);
}
.i{
  width: 22px;
  height: 22px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex: none;
}
.card{
  background: var(--surf);
  border: 1px solid var(--line);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: var(--sh-md);
  transition: transform .2s, box-shadow .2s;
}
.ph{position:relative;height:min(44vh,340px);min-height:230px;overflow:hidden;background:#E8E9F1}
.ph svg{width:100%;height:100%;display:block}
.ph img.card-real-photo{width:100%;height:100%;object-fit:cover;display:block;transition:filter .3s ease,transform .3s ease}
.blur .ph svg{filter:blur(12px);transform:scale(1.1)}
.blur .ph img.card-real-photo{filter:blur(18px);transform:scale(1.12)}
.av-img-box{width:100%;height:100%;border-radius:inherit;overflow:hidden;display:block}
.av-img-box img{width:100%;height:100%;object-fit:cover;display:block}
.av-img-box.blurred img{filter:blur(8px)}
.pill{
  position: absolute;
  inset-block-end: 12px;
  inset-inline-start: 12px;
  background: rgba(31, 32, 36, 0.8);
  backdrop-filter: blur(8px);
  color: #fff;
  border-radius: 999px;
  padding: 5px 14px;
  font-size: 12px;
  font-weight: 600;
  border: 1px solid rgba(255, 255, 255, 0.2);
}
.bd{padding:18px}
.bd h2{font-size:24px;display:flex;align-items:center;gap:8px;font-weight:700}
.bd h2 .i{color:var(--brand);width:20px;height:20px}
.mut{color:var(--mut);margin:4px 0;font-size:13px}
.badge{
  display: inline-flex;
  align-items: center;
  background: var(--highlight-lightest);
  color: var(--highlight-darkest);
  border: 1px solid rgba(0, 111, 253, 0.2);
  border-radius: 999px;
  padding: 3px 10px;
  font-weight: 600;
  font-size: 11px;
  margin-inline-start: 8px;
}
.bd p.b{max-width:60ch;margin:12px 0 0;line-height:1.55;color:var(--body)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:12px 0 0;list-style:none}
.chips li{
  border: 1px solid var(--neutral-light-dark);
  background: var(--neutral-light-light);
  border-radius: 999px;
  padding: 5px 13px;
  font-size: 12px;
  color: var(--neutral-dark-dark);
  font-weight: 500;
}
.acts{display:flex;justify-content:center;align-items:center;gap:32px;margin-top:20px}
.act{
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  background: none;
  border: 0;
  color: var(--ink);
  font-size: 12px;
  font-weight: 600;
  min-width: 68px;
  transition: transform .18s;
}
.act:active{transform:scale(0.92)}
.act .i{
  width: 58px;
  height: 58px;
  padding: 16px;
  border-radius: 50%;
  border: 1.5px solid var(--line);
  background: var(--surf);
  color: var(--neutral-dark-light);
  box-shadow: var(--sh-md);
  transition: all .2s;
}
.act:hover .i{border-color:var(--neutral-light-darkest);transform:scale(1.05)}
.act.like .i{
  background: var(--heart-grad);
  border: 0;
  color: #fff;
  box-shadow: 0 8px 22px var(--heart-shadow);
}
.act.like:hover .i{transform:scale(1.08);box-shadow:0 12px 28px var(--heart-shadow)}

/* ButtonKit Figma Specifications */
.btn{
  min-height: 48px;
  padding: 0 22px;
  border-radius: 12px;
  border: 0;
  background: var(--brand);
  color: #FFFFFF;
  font-weight: 600;
  font-size: 14px;
  display: inline-flex;
  gap: 8px;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 14px rgba(0, 111, 253, 0.25);
  transition: all .18s;
  letter-spacing: -0.01em;
}
.btn:hover{
  background: var(--brand-light);
  box-shadow: 0 6px 18px rgba(0, 111, 253, 0.32);
  transform: translateY(-1px);
}
.btn:active{transform:scale(0.98)}
.btn:disabled{opacity:.5;cursor:default;box-shadow:none;transform:none}
.btn.gold{background:var(--gold-grad);color:#FFFFFF;box-shadow:0 4px 14px rgba(217,119,6,0.3)}
.btn.ghost{background:rgba(255,255,255,0.15);color:#fff;border:1.5px solid rgba(255,255,255,0.4);backdrop-filter:blur(8px)}
.btn.sec{
  background: var(--surf);
  color: var(--brand);
  border: 1.5px solid var(--line);
  box-shadow: var(--sh-sm);
}
.btn.sec:hover{
  border-color: var(--brand);
  background: var(--highlight-lightest);
}

.empty{display:grid;justify-items:center;gap:14px;text-align:center;padding:52px 18px}
.empty h2{font-size:22px}.empty p{margin:0;color:var(--mut);max-width:34ch}
.list{list-style:none;margin:0;padding:0}
.row{
  display: flex;
  gap: 14px;
  align-items: center;
  width: 100%;
  min-height: 68px;
  background: var(--surf);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 10px 14px;
  margin-bottom: 10px;
  color: var(--ink);
  text-align: start;
  box-shadow: var(--sh-sm);
  transition: all .18s;
}
.row:hover{border-color:var(--neutral-light-darkest);box-shadow:var(--sh-md)}
.av{display:block;width:48px;height:48px;border-radius:50%;overflow:hidden;flex:none;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.av svg{width:100%;height:100%;display:block}
.av.s{width:40px;height:40px}
.av.l{width:100px;height:100px;border:3px solid var(--surf);box-shadow:var(--sh-lg)}
.ch{display:flex;flex-direction:column;height:100%}
.chh{display:flex;align-items:center;gap:12px}
.chh h2{font-size:20px}
.ib,.send{
  width: 44px;
  height: 44px;
  border: 0;
  border-radius: 12px;
  display: grid;
  place-items: center;
  background: none;
  color: var(--ink);
  transition: all .18s;
}
.send{
  background: var(--brand);
  color: #fff;
  box-shadow: 0 4px 12px rgba(0, 111, 253, 0.25);
}
.send:hover{transform:scale(1.05)}
[dir=rtl] .ib .i,[dir=rtl] .send .i{transform:scaleX(-1)}
.note{
  display: flex;
  gap: 8px;
  align-items: flex-start;
  font-size: 13px;
  color: var(--mut);
  margin: 8px 0;
  background: var(--highlight-lightest);
  padding: 10px 14px;
  border-radius: 12px;
  border: 1px solid rgba(0, 111, 253, 0.15);
}
.note .i{width:18px;height:18px;color:var(--brand)}
.log{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:10px 0}
.bb{
  margin: 0;
  max-width: 82%;
  padding: 12px 16px;
  border-radius: 16px;
  background: var(--surf);
  border: 1px solid var(--line);
  box-shadow: var(--sh-sm);
  overflow-wrap: anywhere;
  line-height: 1.45;
  font-size: 14px;
}
.bb.me{
  align-self: flex-end;
  background: var(--brand);
  color: #fff;
  border: 0;
  border-bottom-right-radius: 4px;
  box-shadow: 0 4px 14px rgba(0, 111, 253, 0.22);
}
.bb.th{
  align-self: flex-start;
  border-bottom-left-radius: 4px;
}
.inp{display:flex;gap:8px;padding-top:10px}
.inp input{
  flex: 1;
  min-width: 0;
  min-height: 48px;
  border-radius: 12px;
  border: 1.5px solid var(--neutral-light-darkest);
  background: var(--surf);
  color: var(--ink);
  padding: 0 16px;
  font-size: 14px;
  box-shadow: var(--sh-sm);
  transition: all .18s;
}
.inp input:focus{
  border-color: var(--brand);
  outline: none;
  box-shadow: 0 0 0 3px rgba(0, 111, 253, 0.15);
}
.pf{display:grid;gap:16px}
.pf h1{font-size:26px;font-weight:800;letter-spacing:-.025em}
.sw{
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  min-height: 54px;
  width: 100%;
  padding: 0 16px;
  border: 1.5px solid var(--line);
  border-radius: 14px;
  background: var(--surf);
  color: var(--ink);
  text-align: start;
  box-shadow: var(--sh-sm);
}
.sw i{
  width: 48px;
  height: 26px;
  border-radius: 999px;
  background: var(--neutral-light-dark);
  position: relative;
  flex: none;
  transition: background .2s;
}
.sw i::after{
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 2px 5px rgba(0,0,0,0.15);
  transition: transform .2s;
}
[dir=rtl] .sw i::after{left:auto;right:3px}
.sw[aria-checked=true] i{background:var(--brand)}
.sw[aria-checked=true] i::after{transform:translateX(22px)}
[dir=rtl] .sw[aria-checked=true] i::after{transform:translateX(-22px)}
.sf{
  display: flex;
  gap: 14px;
  padding: 16px;
  border-radius: 16px;
  border: 1px solid var(--line);
  background: var(--surf);
  box-shadow: var(--sh-sm);
}
.sf h3{font-size:15px;font-weight:700;margin:0 0 4px}.sf p{margin:0;color:var(--mut);font-size:13px}
.sf .i{color:var(--brand);margin-top:2px}
.ov{
  position: fixed;
  inset: 0;
  background: rgba(31, 32, 36, 0.7);
  backdrop-filter: blur(8px);
  color: #fff;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  animation: pop .25s ease-out;
  z-index: 999;
}
.ov[hidden]{display:none}
.mi{display:grid;justify-items:center;gap:18px;text-align:center;padding:24px 18px}
.mi h2{font-size:38px;font-weight:800}.mi p{margin:0;font-size:15px;color:#E8E9F1}
.pair{display:flex;align-items:center;gap:12px;margin:8px 0}
.pair .i{color:#ED3241;fill:#ED3241;width:34px;height:34px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@keyframes pop{from{opacity:0;transform:scale(.95)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.lite *{animation:none!important;transition:none!important}
.lite .strip{display:none}

/* TextFieldKit Figma Specifications */
label,.lbl{
  display: block;
  font-weight: 700;
  font-size: 13px;
  color: var(--neutral-dark-dark);
  margin: 12px 0 6px;
  letter-spacing: -0.01em;
}
.fld{
  width: 100%;
  min-height: 48px;
  border-radius: 12px;
  border: 1.5px solid var(--neutral-light-darkest);
  background: var(--surf);
  color: var(--ink);
  padding: 0 16px;
  font-size: 14px;
  box-shadow: var(--sh-sm);
  transition: all .18s;
}
.fld:focus{
  border-color: var(--brand);
  outline: none;
  box-shadow: 0 0 0 3px rgba(0, 111, 253, 0.15);
}
.ph2{display:flex;align-items:center;gap:10px;direction:ltr}.ph2 span{font-weight:700;color:var(--brand)}
.err{color:var(--heart);margin:4px 0 0;min-height:1.4em;font-size:12px;font-weight:600}

/* ContentSwitcherKit Figma Specifications */
.seg,.ops{
  display: flex;
  gap: 6px;
  background: var(--neutral-light-medium);
  padding: 4px;
  border-radius: 12px;
}
.seg button,.opb{
  flex: 1;
  min-height: 40px;
  border-radius: 8px;
  border: 0;
  background: transparent;
  color: var(--neutral-dark-light);
  font-weight: 600;
  font-size: 13px;
  transition: all .18s;
  box-shadow: none;
}
.seg [aria-pressed=true],.opb[aria-pressed=true]{
  background: var(--surf);
  color: var(--brand);
  box-shadow: 0 2px 6px rgba(31, 32, 36, 0.08);
}

.plan{
  border: 1.5px solid var(--gold);
  border-radius: 18px;
  padding: 18px;
  background: var(--surf);
  box-shadow: var(--sh-md);
}
.plan h2{font-size:18px;font-weight:700}.plan p{margin:4px 0 0}
.price{display:block;font:800 30px "Inter",system-ui,sans-serif;margin-top:6px;color:var(--gold);letter-spacing:-.02em}
.selfie{
  width: 200px;
  height: 200px;
  border-radius: 50%;
  border: 3.5px solid var(--brand);
  box-shadow: 0 10px 26px rgba(0, 111, 253, 0.22);
  display: grid;
  place-items: center;
  overflow: hidden;
  margin: 14px auto;
  background: #1F2024;
  position: relative;
}
.selfie video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
.selfie .selfie-captured{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:3}
.selfie-ring{position:absolute;inset:6px;border:2px dashed rgba(255,255,255,0.7);border-radius:50%;pointer-events:none;z-index:2}

async function uploadImageToSupabase(dataUrl,fileName){
if(!sbClient||!dataUrl||!dataUrl.startsWith("data:"))return dataUrl;
try{
const b=(window.CHARI_SUPABASE&&window.CHARI_SUPABASE.bucket)||"photo";
const res=await fetch(dataUrl);const blob=await res.blob();
const clean=(fileName||`img_${Date.now()}.jpg`).replace(/[^a-zA-Z0-9_.-]/g,'_');
const path=`uploads/${clean}`;
const {data,error}=await sbClient.storage.from(b).upload(path,blob,{contentType:'image/jpeg',upsert:true});
if(!error&&data){
const {data:pub}=sbClient.storage.from(b).getPublicUrl(path);
if(pub&&pub.publicUrl)return pub.publicUrl;
}
}catch(e){console.warn("Storage upload:",e)}
return dataUrl;
}
async function ensureUserProfileId(){
if(st.u&&st.u.id&&st.u.id.length>20)return st.u.id;
if(!sbClient)return null;
try{
if(sbClient.auth){
const {data:{session}}=await sbClient.auth.getSession();
if(session&&session.user&&session.user.id){
if(!st.u)st.u={};
st.u.id=session.user.id;
if(session.user.email)st.em=session.user.email;
save();
return st.u.id;
}
}
let q=sbClient.from('profiles').select('id');
if(st.em)q=q.eq('email',st.em);
else if(st.u&&st.u.n)q=q.eq('name',st.u.n);
else return null;
const {data}=await q.limit(1);
if(data&&data.length>0){st.u.id=data[0].id;save();return st.u.id;}
}catch(e){console.warn("ensureUserProfileId err:",e)}
return st.u?st.u.id:null;
}

if(!sbClient||!st.u||!st.u.n)return;

gender:st.g,
age:st.u.a,
city:st.u.c,
target_city:st.u.tc||'all',
job:st.u.jb,

religion:st.u.rel||'mus',
children:st.u.kd||0,
intention:st.u.i||'ser',
hobbies:pHobbies,
selfie_url:sUrl,
is_verified:!!st.selfie,
is_premium:!!st.prem
};
if(uid)pData.id=uid;
if(st.em)pData.email=st.em;
if(st.ph)pData.phone=st.ph;

try{
const onC=pData.id?'id':(pData.email?'email':undefined);
const opts=onC?{onConflict:onC}:{};
const {data,error}=await sbClient.from('profiles').upsert(pData,opts).select('id');
if(!error&&data&&data.length>0){
st.u.id=data[0].id;
save();
}else if(error){
console.warn("Supabase profile sync:",error);
}
if(st.ph5&&st.ph5.length){
let chg=false;
for(let idx=0;idx<st.ph5.length;idx++){
const itm=st.ph5[idx];
if(itm.o&&itm.o.startsWith("data:")){
const upO=await uploadImageToSupabase(itm.o,`photo_${st.u.n}_${idx}_orig_${Date.now()}.jpg`);
if(upO&&!upO.startsWith("data:")){itm.o=upO;chg=true;}
}

async function recordLikeInSupabase(receiverProfileId,isMatch){

if(!uid||!receiverProfileId)return;
try{
await sbClient.from('likes').upsert({sender_id:uid,receiver_id:receiverProfileId,is_match:!!isMatch},{onConflict:'sender_id,receiver_id'});
if(isMatch){
await sbClient.from('likes').upsert({sender_id:receiverProfileId,receiver_id:uid,is_match:true},{onConflict:'sender_id,receiver_id'});
}
}catch(e){console.warn("recordLikeInSupabase err:",e)}
}
async function recordMessageInSupabase(receiverProfileId,content,imgUrl,voiceUrl,dur,localMsgObj){
if(!sbClient)return;
const uid=await ensureUserProfileId();
if(!uid||!receiverProfileId)return;
try{
const payload={sender_id:uid,receiver_id:receiverProfileId,content:content||null,image_url:imgUrl||null,voice_url:voiceUrl||null,duration:dur||null};
const {data,error}=await sbClient.from('messages').insert(payload).select('id,created_at');

if(localMsgObj){
localMsgObj.id=data[0].id;
if(data[0].created_at)localMsgObj.time=new Date(data[0].created_at).getTime();
save();
}
}
}catch(e){console.warn("recordMessageInSupabase err:",e)}
}

if(!sbClient)return;

}

async function validateSelfieFace(canvas, ctx){
if(typeof window!=="undefined" && "FaceDetector" in window){
try{
const detector=new window.FaceDetector({maxDetectedFaces:2,fastMode:false});
const faces=await detector.detect(canvas);
if(faces&&faces.length>0){
const f=faces[0],bb=f.boundingBox;
if(bb&&bb.width>=40&&bb.height>=40)return {ok:true};
}
return {ok:false,reason:"no_face_detected"};
}catch(e){console.warn("FaceDetector fallback:",e)}
}

const W=canvas.width,H=canvas.height;
const imgData=ctx.getImageData(0,0,W,H);
const data=imgData.data;
const cx=W/2,cy=H/2;
const rx=W*0.28,ry=H*0.36;

let totalCenter=0,sumLum=0,sumLumSq=0,skinPixels=0,edges=0;
const step=2;

for(let y=1;y<H-1;y+=step){
for(let x=1;x<W-1;x+=step){
const idx=(y*W+x)*4;
const r=data[idx],g=data[idx+1],b=data[idx+2];
const lum=0.299*r+0.587*g+0.114*b;
const dx=(x-cx)/rx,dy=(y-cy)/ry;
if((dx*dx+dy*dy)<=1.0){
totalCenter++;
sumLum+=lum;
sumLumSq+=lum*lum;

const cb=128-0.168736*r-0.331264*g+0.5*b;
const cr=128+0.5*r-0.418688*g-0.081312*b;
const isSkinYCbCr=(cb>=77&&cb<=140&&cr>=128&&cr<=182);
const isWarmTone=(r>b&&(r-b)>=6&&lum>=22&&lum<=200&&cb>=80&&cb<=142&&cr>=125&&cr<=180);

if(isSkinYCbCr||isWarmTone)skinPixels++;

const leftIdx=(y*W+(x-1))*4,rightIdx=(y*W+(x+1))*4;
const upIdx=((y-1)*W+x)*4,downIdx=((y+1)*W+x)*4;
const gx=Math.abs(data[rightIdx]-data[leftIdx]);
const gy=Math.abs(data[downIdx]-data[upIdx]);
if((gx+gy)>26)edges++;
}
}
}

if(totalCenter<100)return {ok:false,reason:"frame_error"};
const meanLum=sumLum/totalCenter;
const stdDev=Math.sqrt(Math.max(0,(sumLumSq/totalCenter)-(meanLum*meanLum)));
const skinRatio=skinPixels/totalCenter;
const edgeRatio=edges/totalCenter;

if(meanLum<20||meanLum>248)return {ok:false,reason:"bad_lighting"};
if(stdDev<15)return {ok:false,reason:"flat_surface"};
if(skinRatio<0.12)return {ok:false,reason:"no_skin"};
if(skinRatio>0.96&&stdDev<20)return {ok:false,reason:"too_uniform"};
if(edgeRatio<0.03)return {ok:false,reason:"no_features"};

return {ok:true};
}

let phoneAudioCtx=null,ringToneTimer=null,ringToneOscs=[];
function getPhoneAudioCtx(){
if(!phoneAudioCtx||phoneAudioCtx.state==='closed'){
const Ctx=window.AudioContext||window.webkitAudioContext;
if(Ctx)phoneAudioCtx=new Ctx();
}
if(phoneAudioCtx&&phoneAudioCtx.state==='suspended'){
phoneAudioCtx.resume().catch(()=>{});
}
return phoneAudioCtx;
}

function startOutgoingPhoneRingtone(){
stopPhoneRingtone();
const ctx=getPhoneAudioCtx();
if(!ctx)return;
function burst(){
try{
const now=ctx.currentTime;
const o1=ctx.createOscillator(),o2=ctx.createOscillator(),g=ctx.createGain();
o1.type="sine";o1.frequency.setValueAtTime(400,now);
o2.type="sine";o2.frequency.setValueAtTime(450,now);
g.gain.setValueAtTime(0,now);
g.gain.linearRampToValueAtTime(0.2,now+0.04);
g.gain.setValueAtTime(0.2,now+1.35);
g.gain.linearRampToValueAtTime(0,now+1.45);
o1.connect(g);o2.connect(g);g.connect(ctx.destination);
o1.start(now);o2.start(now);
o1.stop(now+1.5);o2.stop(now+1.5);
ringToneOscs=[o1,o2];
}catch(e){}
}
burst();
ringToneTimer=setInterval(burst,4000);
}

function playHangupTone(){
stopPhoneRingtone();
const ctx=getPhoneAudioCtx();
if(!ctx)return;
try{
const now=ctx.currentTime;
[0, 0.35, 0.7].forEach(offset=>{
const t=now+offset;
const osc=ctx.createOscillator(),g=ctx.createGain();
osc.type="sine";osc.frequency.setValueAtTime(425,t);
g.gain.setValueAtTime(0.18,t);
g.gain.linearRampToValueAtTime(0,t+0.22);
osc.connect(g);g.connect(ctx.destination);
osc.start(t);osc.stop(t+0.23);
});
}catch(e){}
}

function stopPhoneRingtone(){
if(ringToneTimer){clearInterval(ringToneTimer);ringToneTimer=null;}
ringToneOscs.forEach(o=>{try{o.stop();}catch(e){}});
ringToneOscs=[];
if(navigator.vibrate){try{navigator.vibrate(0);}catch(e){}}
}

function startVideoCall(id){

startOutgoingPhoneRingtone();

function triggerScreenshotBlocked(){
const t=x();
document.body.classList.add("screen-protected");
if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText("").catch(()=>{})}
say(t.scToast);
}
document.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("dragstart",e=>e.preventDefault());
document.addEventListener("keyup",e=>{if(e.key==="PrintScreen")triggerScreenshotBlocked()});
document.addEventListener("keydown",e=>{
if(e.key==="PrintScreen"){e.preventDefault();triggerScreenshotBlocked();return}
const ctrl=e.ctrlKey||e.metaKey;
if(ctrl&&(e.key==="p"||e.key==="P"||e.key==="s"||e.key==="S")){e.preventDefault();triggerScreenshotBlocked();return}
if(ctrl&&e.shiftKey&&(e.key==="s"||e.key==="S"||e.key==="i"||e.key==="I")){e.preventDefault();triggerScreenshotBlocked();return}
if(e.key==="F12"){e.preventDefault();return}
});
window.addEventListener("blur",()=>{document.body.classList.add("screen-protected")});
window.addEventListener("focus",()=>{document.body.classList.remove("screen-protected")});
document.addEventListener("visibilitychange",()=>{
if(document.hidden){document.body.classList.add("screen-protected")}
else{document.body.classList.remove("screen-protected")}
});

let authListenerAttached=false;
function initSocialAuthListener(){
if(!sbClient||authListenerAttached)return;
authListenerAttached=true;
try{
sbClient.auth.onAuthStateChange(async(evt,session)=>{
if((evt==="SIGNED_IN"||evt==="INITIAL_SESSION"||evt==="USER_UPDATED")&&session&&session.user){
const u=session.user;
const meta=u.user_metadata||{};
const gName=meta.full_name||meta.name||(u.email?u.email.split('@')[0]:"Membre");
const gEmail=u.email||"";
const gAvatar=meta.avatar_url||meta.picture||"";

if(!st.u)st.u={};
st.u.gVerif=true;
if(u.id)st.u.id=u.id;
if(gEmail)st.em=gEmail;
st.mode="google";
if(gName&&(!st.u.n||st.u.n==="Mahamat"))st.u.n=gName;

try{
const {data:profData}=await sbClient.from('profiles').select('*').or(`id.eq.${u.id},email.eq.${gEmail}`).limit(1);
if(profData&&profData.length>0){
const r=profData[0];
if(r.name&&r.name!=='__DELETED__'){
st.u.id=r.id;
st.u.n=r.name;
st.u.a=r.age;
st.u.c=r.city;
st.u.tc=r.target_city||'all';
st.u.jb=r.job||'';
st.u.bio=r.bio||'';
st.g=r.gender||st.g||'';
st.u.lng=r.language||'fr';
st.u.rel=r.religion||'mus';
st.u.kd=r.children||0;
st.u.i=r.intention||'ser';
st.u.hb=r.hobbies||[];
if(r.selfie_url&&!st.selfie){
st.selfie=r.selfie_url;
ensureSelfieInPh5();
}
}
}
}catch(err){console.warn("Restoring profile error:",err)}

const isComplete=st.u&&st.u.n&&st.u.n.length>=2&&st.u.jb&&st.u.jb.length>=2&&st.u.a>=22&&st.u.c&&st.u.bio&&st.u.bio.length>=5&&st.g&&st.u.hb&&st.u.hb.length>=1;

if(!isComplete){
go(2,"#nm");
}else if(!st.selfie){
go(3);
}else{
go(st.savedStep||4);
}
say(x().gVerif||"Compte Google vérifié");
save();
render();
syncProfileToSupabase();
}
});

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Chari · Rencontres au Tchad</title>

<!-- PWA & Mobile Meta Tags -->
<meta name="theme-color" content="#12307A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chari">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{
  /* Figma Mobile Apps Prototyping Kit - Tokens officiels */
  --highlight-darkest: #006FFD;
  --highlight-dark: #2897FF;
  --highlight-medium: #6FBAFF;
  --highlight-light: #B4DBFF;
  --highlight-lightest: #EAF2FF;

  --neutral-dark-darkest: #1F2024;
  --neutral-dark-dark: #2F3036;
  --neutral-dark-medium: #494A50;
  --neutral-dark-light: #71727A;
  --neutral-dark-lightest: #8F9098;

  --neutral-light-darkest: #C5C6CC;
  --neutral-light-dark: #D4D6DD;
  --neutral-light-medium: #E8E9F1;
  --neutral-light-light: #F8F9FE;
  --neutral-light-lightest: #FFFFFF;

  --support-success-dark: #298267;
  --support-success-medium: #3AC0A0;
  --support-success-light: #E7F4E8;

  --support-warning-dark: #E86339;
  --support-warning-medium: #FFB37C;
  --support-warning-light: #FFF4E4;

  --support-error-dark: #ED3241;
  --support-error-medium: #FF616D;
  --support-error-light: #FFE2E5;

  /* Mappings semantiques Figma Kit */
  --bg: var(--neutral-light-light);
  --surf: var(--neutral-light-lightest);
  --ink: var(--neutral-dark-darkest);
  --body: var(--neutral-dark-dark);
  --mut: var(--neutral-dark-light);
  --brand: var(--highlight-darkest);
  --brand-light: var(--highlight-dark);
  --brand-grad: linear-gradient(135deg, #006FFD 0%, #2897FF 100%);
  --onb: #FFFFFF;
  --gold: #F59E0B;
  --gold-bg: #FEF3C7;
  --gold-grad: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
  --heart: #ED3241;
  --heart-grad: linear-gradient(135deg, #FF616D 0%, #ED3241 100%);
  --heart-shadow: rgba(237, 50, 65, 0.35);
  --onh: #FFFFFF;
  --line: var(--neutral-light-medium);
  --ring: rgba(0, 111, 253, 0.25);
  --hdr: var(--neutral-light-lightest);
  --sh-sm: 0 1px 3px rgba(31, 32, 36, 0.05), 0 1px 2px rgba(31, 32, 36, 0.03);
  --sh-md: 0 6px 16px rgba(31, 32, 36, 0.06), 0 2px 4px rgba(31, 32, 36, 0.03);
  --sh-lg: 0 16px 36px rgba(31, 32, 36, 0.08), 0 4px 12px rgba(31, 32, 36, 0.04);
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg: #141517;
    --surf: #1F2024;
    --ink: #F8F9FE;
    --body: #D4D6DD;
    --mut: #8F9098;
    --brand: #2897FF;
    --brand-light: #6FBAFF;
    --brand-grad: linear-gradient(135deg, #006FFD 0%, #2897FF 100%);
    --onb: #FFFFFF;
    --gold: #FBBF24;
    --gold-bg: rgba(251, 191, 36, 0.15);
    --gold-grad: linear-gradient(135deg, #FBBF24 0%, #F59E0B 100%);
    --heart: #FF616D;
    --heart-grad: linear-gradient(135deg, #FF616D 0%, #ED3241 100%);
    --heart-shadow: rgba(237, 50, 65, 0.4);
    --line: #2F3036;
    --ring: rgba(40, 151, 255, 0.35);
    --hdr: #1F2024;
    --sh-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
    --sh-md: 0 6px 16px rgba(0, 0, 0, 0.35);
    --sh-lg: 0 16px 36px rgba(0, 0, 0, 0.45);
  }
}
:root[data-theme="dark"]{
  --bg: #141517;
  --surf: #1F2024;
  --ink: #F8F9FE;
  --body: #D4D6DD;
  --mut: #8F9098;
  --brand: #2897FF;
  --brand-light: #6FBAFF;
  --brand-grad: linear-gradient(135deg, #006FFD 0%, #2897FF 100%);
  --onb: #FFFFFF;
  --gold: #FBBF24;
  --gold-bg: rgba(251, 191, 36, 0.15);
  --gold-grad: linear-gradient(135deg, #FBBF24 0%, #F59E0B 100%);
  --heart: #FF616D;
  --heart-grad: linear-gradient(135deg, #FF616D 0%, #ED3241 100%);
  --heart-shadow: rgba(237, 50, 65, 0.4);
  --line: #2F3036;
  --ring: rgba(40, 151, 255, 0.35);
  --hdr: #1F2024;
}
*,*::before,*::after{box-sizing:border-box}
html{
  width: 100%;
  max-width: 100vw;
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
  scroll-padding-top: env(safe-area-inset-top, 0px);
}
html,body{
  height: 100%;
  margin: 0;
  padding: 0;
  width: 100%;
  max-width: 100vw;
  overflow-x: hidden;
}
body{
  background: var(--bg);
  color: var(--body);
  font: 400 15px/1.5 "Inter", "IBM Plex Sans Arabic", system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.01em;
  position: relative;
  touch-action: pan-y;
}
h1,h2,h3{
  color: var(--ink);
  font-family: "Inter", "IBM Plex Sans Arabic", system-ui, sans-serif;
  margin: 0;
  line-height: 1.25;
}
h1{font-weight: 800; font-size: 26px; letter-spacing: -0.025em}
h2{font-weight: 700; font-size: 20px; letter-spacing: -0.02em}
h3{font-weight: 700; font-size: 15px}
button,input,select,textarea{font:inherit;max-width:100%;box-sizing:border-box}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
header :focus-visible,.ov :focus-visible{outline-color:var(--brand-light)}
.app{
  height: 100%;
  min-height: 100%;
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  box-shadow: 0 0 50px rgba(31, 32, 36, 0.08);
  background: var(--bg);
  overflow-x: hidden;
  box-sizing: border-box;
  position: relative;
  display: flex;
  flex-direction: column;
}
header{
  width: 100%;
  max-width: 100%;
  box-sizing: border-box;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: var(--hdr);
  color: var(--ink);
  border-bottom: 1px solid var(--line);
  box-shadow: var(--sh-sm);
  z-index: 10;
}
.logo{
  font-family: "Inter", "IBM Plex Sans Arabic", system-ui, sans-serif;
  font-size: 24px;
  font-weight: 800;
  letter-spacing: -0.03em;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 6px;
}
.logo::after{
  content: "";
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--brand);
}
.lg{
  min-height: 36px;
  padding: 0 14px;
  border-radius: 999px;
  border: 1.5px solid var(--highlight-light);
  background: var(--highlight-lightest);
  color: var(--highlight-darkest);
  font-weight: 600;
  font-size: 12px;
  transition: all .18s;
  letter-spacing: 0.01em;
}
.lg:hover{
  background: #dbeafe;
  border-color: var(--brand);
}
.strip{
  height: 3px;
  flex: none;
  background: var(--brand-grad);
}
main{
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 16px 14px;
  width: 100%;
  max-width: 100%;
  box-sizing: border-box;
  -webkit-overflow-scrolling: touch;
}
nav{
  width: 100%;
  max-width: 100%;
  box-sizing: border-box;
  display: flex;
  border-top: 1px solid var(--line);
  background: var(--surf);
  box-shadow: 0 -4px 18px rgba(31, 32, 36, 0.04);
  min-height: 64px;
  position: relative;
  z-index: 5;
}
nav button{
  flex: 1;
  min-height: 64px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  border: 0;
  background: none;
  color: var(--neutral-dark-lightest);
  font-size: 11px;
  font-weight: 600;
  transition: all .2s;
  position: relative;
  letter-spacing: 0.01em;
}
nav button:hover{color: var(--ink)}
nav [aria-current]{color: var(--brand); font-weight: 700}
nav [aria-current]::after{
  content: "";
  position: absolute;
  top: 0;
  width: 28px;
  height: 3px;
  border-radius: 0 0 4px 4px;
  background: var(--brand);
}
.i{
  width: 22px;
  height: 22px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex: none;
}
.card{
  background: var(--surf);
  border: 1px solid var(--line);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: var(--sh-md);
  transition: transform .2s, box-shadow .2s;
}
.ph{position:relative;height:min(44vh,340px);min-height:230px;overflow:hidden;background:#E8E9F1}
.ph svg{width:100%;height:100%;display:block}
.ph img.card-real-photo{width:100%;height:100%;object-fit:cover;display:block;transition:filter .3s ease,transform .3s ease}
.blur .ph svg{filter:blur(12px);transform:scale(1.1)}
.blur .ph img.card-real-photo{filter:blur(18px);transform:scale(1.12)}
.av-img-box{width:100%;height:100%;border-radius:inherit;overflow:hidden;display:block}
.av-img-box img{width:100%;height:100%;object-fit:cover;display:block}
.av-img-box.blurred img{filter:blur(8px)}
.pill{
  position: absolute;
  inset-block-end: 12px;
  inset-inline-start: 12px;
  background: rgba(31, 32, 36, 0.8);
  backdrop-filter: blur(8px);
  color: #fff;
  border-radius: 999px;
  padding: 5px 14px;
  font-size: 12px;
  font-weight: 600;
  border: 1px solid rgba(255, 255, 255, 0.2);
}
.bd{padding:18px}
.bd h2{font-size:24px;display:flex;align-items:center;gap:8px;font-weight:700}
.bd h2 .i{color:var(--brand);width:20px;height:20px}
.mut{color:var(--mut);margin:4px 0;font-size:13px}
.badge{
  display: inline-flex;
  align-items: center;
  background: var(--highlight-lightest);
  color: var(--highlight-darkest);
  border: 1px solid rgba(0, 111, 253, 0.2);
  border-radius: 999px;
  padding: 3px 10px;
  font-weight: 600;
  font-size: 11px;
  margin-inline-start: 8px;
}
.bd p.b{max-width:60ch;margin:12px 0 0;line-height:1.55;color:var(--body)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:12px 0 0;list-style:none}
.chips li{
  border: 1px solid var(--neutral-light-dark);
  background: var(--neutral-light-light);
  border-radius: 999px;
  padding: 5px 13px;
  font-size: 12px;
  color: var(--neutral-dark-dark);
  font-weight: 500;
}
.acts{display:flex;justify-content:center;align-items:center;gap:32px;margin-top:20px}
.act{
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  background: none;
  border: 0;
  color: var(--ink);
  font-size: 12px;
  font-weight: 600;
  min-width: 68px;
  transition: transform .18s;
}
.act:active{transform:scale(0.92)}
.act .i{
  width: 58px;
  height: 58px;
  padding: 16px;
  border-radius: 50%;
  border: 1.5px solid var(--line);
  background: var(--surf);
  color: var(--neutral-dark-light);
  box-shadow: var(--sh-md);
  transition: all .2s;
}
.act:hover .i{border-color:var(--neutral-light-darkest);transform:scale(1.05)}
.act.like .i{
  background: var(--heart-grad);
  border: 0;
  color: #fff;
  box-shadow: 0 8px 22px var(--heart-shadow);
}
.act.like:hover .i{transform:scale(1.08);box-shadow:0 12px 28px var(--heart-shadow)}

/* ButtonKit Figma Specifications */
.btn{
  min-height: 48px;
  padding: 0 22px;
  border-radius: 12px;
  border: 0;
  background: var(--brand);
  color: #FFFFFF;
  font-weight: 600;
  font-size: 14px;
  display: inline-flex;
  gap: 8px;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 14px rgba(0, 111, 253, 0.25);
  transition: all .18s;
  letter-spacing: -0.01em;
}
.btn:hover{
  background: var(--brand-light);
  box-shadow: 0 6px 18px rgba(0, 111, 253, 0.32);
  transform: translateY(-1px);
}
.btn:active{transform:scale(0.98)}
.btn:disabled{opacity:.5;cursor:default;box-shadow:none;transform:none}
.btn.gold{background:var(--gold-grad);color:#FFFFFF;box-shadow:0 4px 14px rgba(217,119,6,0.3)}
.btn.ghost{background:rgba(255,255,255,0.15);color:#fff;border:1.5px solid rgba(255,255,255,0.4);backdrop-filter:blur(8px)}
.btn.sec{
  background: var(--surf);
  color: var(--brand);
  border: 1.5px solid var(--line);
  box-shadow: var(--sh-sm);
}
.btn.sec:hover{
  border-color: var(--brand);
  background: var(--highlight-lightest);
}

.empty{display:grid;justify-items:center;gap:14px;text-align:center;padding:52px 18px}
.empty h2{font-size:22px}.empty p{margin:0;color:var(--mut);max-width:34ch}
.list{list-style:none;margin:0;padding:0}
.row{
  display: flex;
  gap: 14px;
  align-items: center;
  width: 100%;
  min-height: 68px;
  background: var(--surf);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 10px 14px;
  margin-bottom: 10px;
  color: var(--ink);
  text-align: start;
  box-shadow: var(--sh-sm);
  transition: all .18s;
}
.row:hover{border-color:var(--neutral-light-darkest);box-shadow:var(--sh-md)}
.av{display:block;width:48px;height:48px;border-radius:50%;overflow:hidden;flex:none;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.av svg{width:100%;height:100%;display:block}
.av.s{width:40px;height:40px}
.av.l{width:100px;height:100px;border:3px solid var(--surf);box-shadow:var(--sh-lg)}
.ch{display:flex;flex-direction:column;height:100%}
.chh{display:flex;align-items:center;gap:12px}
.chh h2{font-size:20px}
.ib,.send{
  width: 44px;
  height: 44px;
  border: 0;
  border-radius: 12px;
  display: grid;
  place-items: center;
  background: none;
  color: var(--ink);
  transition: all .18s;
}
.send{
  background: var(--brand);
  color: #fff;
  box-shadow: 0 4px 12px rgba(0, 111, 253, 0.25);
}
.send:hover{transform:scale(1.05)}
[dir=rtl] .ib .i,[dir=rtl] .send .i{transform:scaleX(-1)}
.note{
  display: flex;
  gap: 8px;
  align-items: flex-start;
  font-size: 13px;
  color: var(--mut);
  margin: 8px 0;
  background: var(--highlight-lightest);
  padding: 10px 14px;
  border-radius: 12px;
  border: 1px solid rgba(0, 111, 253, 0.15);
}
.note .i{width:18px;height:18px;color:var(--brand)}
.log{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:10px 0}
.bb{
  margin: 0;
  max-width: 82%;
  padding: 12px 16px;
  border-radius: 16px;
  background: var(--surf);
  border: 1px solid var(--line);
  box-shadow: var(--sh-sm);
  overflow-wrap: anywhere;
  line-height: 1.45;
  font-size: 14px;
}
.bb.me{
  align-self: flex-end;
  background: var(--brand);
  color: #fff;
  border: 0;
  border-bottom-right-radius: 4px;
  box-shadow: 0 4px 14px rgba(0, 111, 253, 0.22);
}
.bb.th{
  align-self: flex-start;
  border-bottom-left-radius: 4px;
}
.inp{display:flex;gap:8px;padding-top:10px}
.inp input{
  flex: 1;
  min-width: 0;
  min-height: 48px;
  border-radius: 12px;
  border: 1.5px solid var(--neutral-light-darkest);
  background: var(--surf);
  color: var(--ink);
  padding: 0 16px;
  font-size: 14px;
  box-shadow: var(--sh-sm);
  transition: all .18s;
}
.inp input:focus{
  border-color: var(--brand);
  outline: none;
  box-shadow: 0 0 0 3px rgba(0, 111, 253, 0.15);
}
.pf{
  display: grid;
  gap: 14px;
  width: 100%;
  max-width: 100%;
  box-sizing: border-box;
  overflow-x: hidden;
}
.pf h1{font-size:26px;font-weight:800;letter-spacing:-.025em}
.sw{
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  min-height: 54px;
  width: 100%;
  padding: 0 16px;
  border: 1.5px solid var(--line);
  border-radius: 14px;
  background: var(--surf);
  color: var(--ink);
  text-align: start;
  box-shadow: var(--sh-sm);
}
.sw i{
  width: 48px;
  height: 26px;
  border-radius: 999px;
  background: var(--neutral-light-dark);
  position: relative;
  flex: none;
  transition: background .2s;
}
.sw i::after{
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 2px 5px rgba(0,0,0,0.15);
  transition: transform .2s;
}
[dir=rtl] .sw i::after{left:auto;right:3px}
.sw[aria-checked=true] i{background:var(--brand)}
.sw[aria-checked=true] i::after{transform:translateX(22px)}
[dir=rtl] .sw[aria-checked=true] i::after{transform:translateX(-22px)}
.sf{
  display: flex;
  gap: 14px;
  padding: 16px;
  border-radius: 16px;
  border: 1px solid var(--line);
  background: var(--surf);
  box-shadow: var(--sh-sm);
}
.sf h3{font-size:15px;font-weight:700;margin:0 0 4px}.sf p{margin:0;color:var(--mut);font-size:13px}
.sf .i{color:var(--brand);margin-top:2px}
.ov{
  position: fixed;
  inset: 0;
  background: rgba(31, 32, 36, 0.7);
  backdrop-filter: blur(8px);
  color: #fff;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  animation: pop .25s ease-out;
  z-index: 999;
}
.ov[hidden]{display:none}
.mi{display:grid;justify-items:center;gap:18px;text-align:center;padding:24px 18px}
.mi h2{font-size:38px;font-weight:800}.mi p{margin:0;font-size:15px;color:#E8E9F1}
.pair{display:flex;align-items:center;gap:12px;margin:8px 0}
.pair .i{color:#ED3241;fill:#ED3241;width:34px;height:34px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@keyframes pop{from{opacity:0;transform:scale(.95)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.lite *{animation:none!important;transition:none!important}
.lite .strip{display:none}

/* TextFieldKit Figma Specifications */
label,.lbl{
  display: block;
  font-weight: 700;
  font-size: 13px;
  color: var(--neutral-dark-dark);
  margin: 12px 0 6px;
  letter-spacing: -0.01em;
}
.fld{
  width: 100%;
  min-height: 48px;
  border-radius: 12px;
  border: 1.5px solid var(--neutral-light-darkest);
  background: var(--surf);
  color: var(--ink);
  padding: 0 16px;
  font-size: 14px;
  box-shadow: var(--sh-sm);
  transition: all .18s;
}
.fld:focus{
  border-color: var(--brand);
  outline: none;
  box-shadow: 0 0 0 3px rgba(0, 111, 253, 0.15);
}
.ph2{display:flex;align-items:center;gap:10px;direction:ltr}.ph2 span{font-weight:700;color:var(--brand)}
.err{color:var(--heart);margin:4px 0 0;min-height:1.4em;font-size:12px;font-weight:600}

/* ContentSwitcherKit Figma Specifications */
.seg,.ops{
  display: flex;
  gap: 6px;
  background: var(--neutral-light-medium);
  padding: 4px;
  border-radius: 12px;
}
.seg button,.opb{
  flex: 1;
  min-height: 40px;
  border-radius: 8px;
  border: 0;
  background: transparent;
  color: var(--neutral-dark-light);
  font-weight: 600;
  font-size: 13px;
  transition: all .18s;
  box-shadow: none;
}
.seg [aria-pressed=true],.opb[aria-pressed=true]{
  background: var(--surf);
  color: var(--brand);
  box-shadow: 0 2px 6px rgba(31, 32, 36, 0.08);
}

.plan{
  border: 1.5px solid var(--gold);
  border-radius: 18px;
  padding: 18px;

.hero-box{

}

.btn-fb{

.rec-pulse{background:#ED3241!important;color:#fff!important;animation:pulse-rec 1.2s infinite ease-in-out}
@keyframes pulse-rec{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(237,50,65,0.4)}50%{transform:scale(1.1);box-shadow:0 0 0 8px rgba(237,50,65,0)}}
.visa-card-box{
  background: linear-gradient(135deg, #006FFD 0%, #1A1F71 100%);

.flag-mini svg{border-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,0.15);display:block}

/* Appel Video */
.call-box{position:fixed;inset:0;background:#090A0F;color:#fff;display:flex;flex-direction:column;justify-content:space-between;z-index:1000;overflow:hidden;animation:pop .25s ease-out}
.call-top{position:absolute;top:0;inset-inline:0;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 18px;background:linear-gradient(to bottom,rgba(9,10,15,0.88) 0%,transparent 100%);display:flex;justify-content:space-between;align-items:center;z-index:20}
.call-user{display:flex;align-items:center;gap:12px}
.call-user h3{color:#fff;font-size:17px;margin:0;font-weight:700}
.call-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#3AC0A0;font-weight:600}
.call-dot{width:8px;height:8px;border-radius:50%;background:#3AC0A0;animation:pulse-rec 1.4s infinite}
.call-dur{font-family:monospace;font-size:13px;color:rgba(255,255,255,0.85);background:rgba(255,255,255,0.12);padding:4px 10px;border-radius:999px;backdrop-filter:blur(6px)}
.call-stage{position:relative;flex:1;display:flex;align-items:center;justify-content:center;background:#14151B;overflow:hidden}
.call-remote-art{display:flex;flex-direction:column;align-items:center;gap:14px;position:relative}
.call-remote-av{width:140px;height:140px;border-radius:50%;border:4px solid rgba(255,255,255,0.25);box-shadow:0 16px 40px rgba(0,0,0,0.6);overflow:hidden;position:relative}
.call-waves{position:absolute;inset:-18px;border-radius:50%;border:2px solid rgba(0,111,253,0.35);animation:call-wave 2s infinite ease-out;pointer-events:none}
@keyframes call-wave{0%{transform:scale(0.85);opacity:0.8}100%{transform:scale(1.4);opacity:0}}
.call-pip{position:absolute;top:calc(env(safe-area-inset-top,0px) + 72px);right:16px;width:104px;height:148px;border-radius:16px;background:#23242B;border:2px solid rgba(255,255,255,0.35);overflow:hidden;box-shadow:0 10px 28px rgba(0,0,0,0.5);z-index:25}
[dir="rtl"] .call-pip{right:auto;left:16px}
.call-pip video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
.call-bottom{position:absolute;bottom:0;inset-inline:0;padding:20px 24px calc(env(safe-area-inset-bottom,0px) + 24px);background:linear-gradient(to top,rgba(9,10,15,0.92) 0%,transparent 100%);display:flex;justify-content:center;align-items:center;gap:20px;z-index:20}
.c-btn{width:52px;height:52px;border-radius:50%;border:0;display:grid;place-items:center;background:rgba(255,255,255,0.18);backdrop-filter:blur(8px);color:#fff;cursor:pointer;transition:transform .15s, background .15s}
.c-btn:active{transform:scale(0.92)}
.c-btn.off{background:rgba(237,50,65,0.25);color:#FF616D;border:1.5px solid #ED3241}
.c-btn.hangup{width:64px;height:64px;background:#ED3241;color:#fff;box-shadow:0 8px 22px rgba(237,50,65,0.45)}
.c-btn.hangup:hover{background:#dc2626}

/* Modale de signalement & blocage */
.sheet-box{background:var(--surf);border-radius:24px;padding:24px;max-width:420px;width:92%;margin:auto;box-shadow:var(--sh-lg);display:grid;gap:14px;border:1px solid var(--line)}
.sheet-btn{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surf);color:var(--ink);padding:0 16px;font-weight:600;font-size:14px;cursor:pointer;transition:all .18s;text-align:start}
.sheet-btn:hover{border-color:var(--neutral-dark-light);background:var(--neutral-light-light)}

.sheet-btn.danger:hover{background:#ffe2e5;border-color:var(--heart)}
.rep-option{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surf);cursor:pointer;font-size:13px;font-weight:600;color:var(--ink);transition:all .15s;text-align:start}
.rep-option:hover{border-color:var(--brand);background:var(--highlight-lightest)}
.bb.sys{align-self:center;background:var(--highlight-lightest);color:var(--brand);border:1px solid rgba(0,111,253,0.18);font-size:12px;font-weight:600;padding:6px 14px;border-radius:999px;box-shadow:none;text-align:center;max-width:90%}
.selfie-badge{position:absolute;bottom:6px;inset-inline-start:6px;background:var(--brand);color:#fff;padding:2px 7px;border-radius:999px;font-size:10px;font-weight:700;display:inline-flex;align-items:center;gap:4px;box-shadow:0 2px 6px rgba(0,0,0,0.3);z-index:2;white-space:nowrap}

.pt.pt-selfie{border:2px solid var(--brand)!important}
.fb-stars{display:flex;justify-content:center;gap:10px;margin:6px 0}
.fb-star{background:none;border:0;font-size:32px;color:#D1D5DB;cursor:pointer;transition:transform .15s, color .15s;padding:0;line-height:1}
.fb-star.on{color:#F59E0B;transform:scale(1.15)}
*, *::before, *::after{-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-touch-callout:none}
input, textarea, [contenteditable="true"]{-webkit-user-select:text;-moz-user-select:text;user-select:text}
img{-webkit-user-drag:none;user-drag:none}
@media print{html,body{display:none!important;visibility:hidden!important}}
.screen-shield{position:fixed;inset:0;background:rgba(11,19,43,0.92);backdrop-filter:blur(8px);color:#fff;z-index:999999;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 24px}

/* Quota Badges & Counters */

  display: flex;
  align-items: center;

  gap: 8px;

  background: var(--brand);

}
.m-subtab:not(.active) .m-badge{

/* Incoming Request Cards */
.req-list{
  display: grid;
  gap: 12px;
  margin-top: 8px;
}
.req-card{
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 16px;
  border-radius: 16px;
  border: 1px solid var(--line);
  background: var(--surf);
  box-shadow: var(--sh-sm);
  transition: transform .15s, box-shadow .15s;
}
.req-card:hover{
  box-shadow: var(--sh-md);
}
.req-photo-box{
  position: relative;
  width: calc(100% + 32px);
  margin: -16px -16px 10px -16px;
  height: 290px;
  overflow: hidden;
  border-radius: 15px 15px 0 0;
  background: #0f172a;
}
.req-photo-img{
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  cursor: pointer;
}
.req-header{
  display: flex;
  align-items: center;
  gap: 14px;
}
.req-info{
  flex: 1;
  min-width: 0;
}
.req-info h3{
  margin: 0;
  font-size: 16px;
  font-weight: 700;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 6px;
}
.req-info p{
  margin: 2px 0 0;
  color: var(--mut);
  font-size: 13px;
}
.req-bio{
  font-size: 13px;
  color: var(--ink);
  background: rgba(0, 0, 0, 0.025);
  padding: 10px 14px;
  border-radius: 12px;
  margin: 0;
  line-height: 1.45;
  border-inline-start: 3px solid var(--brand);
  font-style: italic;
}
.req-actions{
  display: flex;
  gap: 10px;
}
.req-actions .btn{
  flex: 1;
  min-height: 42px;
  font-size: 13px;
  padding: 0 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.btn-accept-req{
  background: linear-gradient(135deg, #E11D48 0%, #BE123C 100%);
  color: #fff;
  border: none;
  font-weight: 700;
  box-shadow: 0 3px 10px rgba(225,29,72,0.25);
}
.btn-accept-req:hover{
  background: linear-gradient(135deg, #BE123C 0%, #9F1239 100%);
}
.btn-decline-req{
  border: 1.5px solid #CBD5E1;
  color: #64748B;
  background: #FFF;
  font-weight: 600;
}
.btn-decline-req:hover{
  background: #F1F5F9;
  color: #0F172A;
  border-color: #94A3B8;
}

.card-photo-bars{position:absolute;top:10px;left:0;right:0;display:flex;gap:4px;padding:0 12px;z-index:6}
.photo-bar{flex:1;height:3.5px;border-radius:2px;background:rgba(255,255,255,0.45);transition:background .2s}
.photo-bar.active{background:#fff}
.photo-nav-tap{position:absolute;top:0;bottom:0;width:40%;z-index:4;cursor:pointer}
.photo-nav-left{left:0}

.photo-counter-badge{position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,0.65);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;backdrop-filter:blur(4px);z-index:5}

@keyframes selfieShake{
  0%, 100%{ transform: translate(-50%, -50%) rotate(0deg); }
  20%, 60%{ transform: translate(calc(-50% - 6px), -50%) rotate(-1.5deg); }
  40%, 80%{ transform: translate(calc(-50% + 6px), -50%) rotate(1.5deg); }
}
.call-ringing-pulse{

  0%{ box-shadow: 0 0 0 0 rgba(0, 111, 253, 0.7); }

async function loadLikesAndMatchesFromSupabase(){
if(!sbClient)return;
const uid=await ensureUserProfileId();
if(!uid)return;
try{
const {data,error}=await sbClient.from('likes').select('*').or(`sender_id.eq.${uid},receiver_id.eq.${uid}`);
if(error){console.warn("loadLikes error:",error);return;}
if(data){
const pendingSenderIds=[];
const passedSet=new Set((st.passed||[]).map(String));
const blockedSet=new Set((st.blocked||[]).map(String));
data.forEach(l=>{
if(l.is_match){
const otherId=l.sender_id===uid?l.receiver_id:l.sender_id;
if(!st.mt.includes(otherId))st.mt.push(otherId);
if(!st.ms[otherId])st.ms[otherId]=[];
if(st.incomingRequests)st.incomingRequests=st.incomingRequests.filter(r=>String(r.id)!==String(otherId));
if(st.sentRequests)st.sentRequests=st.sentRequests.filter(r=>String(r.id)!==String(otherId));
}else if(l.receiver_id===uid&&l.sender_id!==uid){
const sSender=String(l.sender_id);
if(!st.mt.map(String).includes(sSender)&&!passedSet.has(sSender)&&!blockedSet.has(sSender)){
pendingSenderIds.push(l.sender_id);
}
}
});
if(st.incomingRequests){
st.incomingRequests=st.incomingRequests.filter(r=>
pendingSenderIds.some(pid=>String(pid)===String(r.id))&&
!passedSet.has(String(r.id))&&
!blockedSet.has(String(r.id))&&
!st.mt.map(String).includes(String(r.id))
);
}else{
st.incomingRequests=[];
}
const activeSentReceiverIds=new Set(data.filter(l=>l.sender_id===uid&&!l.is_match).map(l=>String(l.receiver_id)));
if(st.sentRequests){
st.sentRequests=st.sentRequests.filter(s=>activeSentReceiverIds.has(String(s.id))&&!passedSet.has(String(s.id))&&!blockedSet.has(String(s.id)));
}
if(pendingSenderIds.length>0){
const missingIds=pendingSenderIds.filter(pid=>!st.incomingRequests.some(r=>String(r.id)===String(pid)&&r.n&&r.n!=='Nouveau membre'&&r.n!=='__DELETED__'));
if(missingIds.length>0){
const {data:profRows}=await sbClient.from('profiles').select('*, user_photos(id, photo_url, blurred_url, is_selfie, position)').in('id',missingIds);
missingIds.forEach(pid=>{
const sPid=String(pid);
if(passedSet.has(sPid)||blockedSet.has(sPid)||st.mt.map(String).includes(sPid))return;
const row=profRows&&profRows.find(r=>String(r.id)===sPid);
const rawPhotos=row&&Array.isArray(row.user_photos)&&row.user_photos.length>0
?row.user_photos.sort((a,b)=>(a.position||0)-(b.position||0)).map(up=>up.photo_url||up.blurred_url)
:[];
const pPhotos=rawPhotos.length>0?rawPhotos:(row&&row.selfie_url?[row.selfie_url]:[]);
const validName=(row&&row.name&&row.name!=='__DELETED__')?row.name:"Nouveau membre";
const reqItem={
id:sPid,
n:validName,
g:(row&&row.gender)||(st.g==="m"?"f":"m"),
a:(row&&row.age)||25,
c:(row&&row.city)||"N'Djamena",
jb:(row&&row.job)||"Membre vérifié",
bio:(row&&row.bio)||"",
rel:(row&&row.religion)||"mus",
religion:(row&&row.religion)||"mus",
lng:(row&&row.language)||"fr",
language:(row&&row.language)||"fr",
kd:row&&row.children!==undefined?row.children:0,
children:row&&row.children!==undefined?row.children:0,
i:(row&&row.intention)||"ser",
intention:(row&&row.intention)||"ser",
hb:(row&&row.hobbies)||[],
hobbies:(row&&row.hobbies)||[],
selfie_url:(row&&row.selfie_url)||pPhotos[0]||"",
photos:pPhotos,
time:Date.now()
};
const existingIdx=st.incomingRequests.findIndex(r=>String(r.id)===sPid);
if(existingIdx>=0){
st.incomingRequests[existingIdx]=reqItem;
}else{
st.incomingRequests.push(reqItem);
}
});
}
}
save();
render();
}else{
if(st.incomingRequests&&st.incomingRequests.length>0){
st.incomingRequests=[];
save();
render();
}
if(st.sentRequests&&st.sentRequests.length>0){
st.sentRequests=[];
save();
render();
}
}
}catch(e){console.warn("loadLikes err:",e)}
}
async function loadBlockedUsersFromSupabase(){
if(!sbClient)return;

try{
const {data,error}=await sbClient.from('user_blocks').select('blocked_id, reason').eq('user_id',uid);

if(!st.blocked)st.blocked=[];
let changed=false;
data.forEach(b=>{

if(!st.passed.map(String).includes(bid)){
st.passed.push(bid);
changed=true;
}
}else{
if(!st.blocked.map(String).includes(bid)){
st.blocked.push(bid);
changed=true;
}
if(!st.passed.map(String).includes(bid)){
st.passed.push(bid);
changed=true;
}
}
});
if(changed){
save();
if(st.tab==='d'||st.tab==='req')render();
}
}
}catch(e){console.warn("loadBlockedUsersFromSupabase err:",e)}
}

async function validateSelfieFace(canvas, ctx){
if(typeof window!=="undefined" && "FaceDetector" in window){
try{
const detector=new window.FaceDetector({maxDetectedFaces:2,fastMode:false});
const faces=await detector.detect(canvas);
if(faces&&faces.length>0){
const f=faces[0],bb=f.boundingBox;
if(bb&&bb.width>=40&&bb.height>=40)return {ok:true};
}
return {ok:false,reason:"no_face_detected"};
}catch(e){console.warn("FaceDetector fallback:",e)}
}

const W=canvas.width,H=canvas.height;
const imgData=ctx.getImageData(0,0,W,H);
const data=imgData.data;
const cx=W/2,cy=H/2;
const rx=W*0.28,ry=H*0.36;

let totalCenter=0,sumLum=0,sumLumSq=0,skinPixels=0,edges=0;
const step=2;

for(let y=1;y<H-1;y+=step){
for(let x=1;x<W-1;x+=step){
const idx=(y*W+x)*4;
const r=data[idx],g=data[idx+1],b=data[idx+2];
const lum=0.299*r+0.587*g+0.114*b;
const dx=(x-cx)/rx,dy=(y-cy)/ry;
if((dx*dx+dy*dy)<=1.0){
totalCenter++;
sumLum+=lum;
sumLumSq+=lum*lum;

const cb=128-0.168736*r-0.331264*g+0.5*b;
const cr=128+0.5*r-0.418688*g-0.081312*b;
const isSkinYCbCr=(cb>=77&&cb<=140&&cr>=128&&cr<=182);
const isWarmTone=(r>b&&(r-b)>=6&&lum>=22&&lum<=200&&cb>=80&&cb<=142&&cr>=125&&cr<=180);

if(isSkinYCbCr||isWarmTone)skinPixels++;

const leftIdx=(y*W+(x-1))*4,rightIdx=(y*W+(x+1))*4;
const upIdx=((y-1)*W+x)*4,downIdx=((y+1)*W+x)*4;
const gx=Math.abs(data[rightIdx]-data[leftIdx]);
const gy=Math.abs(data[downIdx]-data[upIdx]);
if((gx+gy)>26)edges++;
}
}
}

if(totalCenter<100)return {ok:false,reason:"frame_error"};
const meanLum=sumLum/totalCenter;
const stdDev=Math.sqrt(Math.max(0,(sumLumSq/totalCenter)-(meanLum*meanLum)));
const skinRatio=skinPixels/totalCenter;
const edgeRatio=edges/totalCenter;

if(meanLum<20||meanLum>248)return {ok:false,reason:"bad_lighting"};
if(stdDev<15)return {ok:false,reason:"flat_surface"};
if(skinRatio<0.12)return {ok:false,reason:"no_skin"};
if(skinRatio>0.96&&stdDev<20)return {ok:false,reason:"too_uniform"};
if(edgeRatio<0.03)return {ok:false,reason:"no_features"};

return {ok:true};
}

}

},1000);
const mime=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':

const mr=new MediaRecorder(stream,mime?{mimeType:mime}:{});
recState.mr=mr;

};

}).catch(()=>{

});
}else{

if(btn)btn.classList.remove("rec-pulse");

let phoneAudioCtx=null,ringToneTimer=null,ringToneOscs=[];
function getPhoneAudioCtx(){
if(!phoneAudioCtx||phoneAudioCtx.state==='closed'){
const Ctx=window.AudioContext||window.webkitAudioContext;
if(Ctx)phoneAudioCtx=new Ctx();
}
if(phoneAudioCtx&&phoneAudioCtx.state==='suspended'){
phoneAudioCtx.resume().catch(()=>{});
}
return phoneAudioCtx;
}

function startOutgoingPhoneRingtone(){
stopPhoneRingtone();
const ctx=getPhoneAudioCtx();
if(!ctx)return;
function burst(){
try{
const now=ctx.currentTime;
const o1=ctx.createOscillator(),o2=ctx.createOscillator(),g=ctx.createGain();
o1.type="sine";o1.frequency.setValueAtTime(400,now);
o2.type="sine";o2.frequency.setValueAtTime(450,now);
g.gain.setValueAtTime(0,now);
g.gain.linearRampToValueAtTime(0.2,now+0.04);
g.gain.setValueAtTime(0.2,now+1.35);
g.gain.linearRampToValueAtTime(0,now+1.45);
o1.connect(g);o2.connect(g);g.connect(ctx.destination);
o1.start(now);o2.start(now);
o1.stop(now+1.5);o2.stop(now+1.5);
ringToneOscs=[o1,o2];
}catch(e){}
}
burst();
ringToneTimer=setInterval(burst,4000);
}

function playHangupTone(){
stopPhoneRingtone();
const ctx=getPhoneAudioCtx();
if(!ctx)return;
try{
const now=ctx.currentTime;
[0, 0.35, 0.7].forEach(offset=>{
const t=now+offset;
const osc=ctx.createOscillator(),g=ctx.createGain();
osc.type="sine";osc.frequency.setValueAtTime(425,t);
g.gain.setValueAtTime(0.18,t);
g.gain.linearRampToValueAtTime(0,t+0.22);
osc.connect(g);g.connect(ctx.destination);
osc.start(t);osc.stop(t+0.23);
});
}catch(e){}
}

function stopPhoneRingtone(){
if(ringToneTimer){clearInterval(ringToneTimer);ringToneTimer=null;}
ringToneOscs.forEach(o=>{try{o.stop();}catch(e){}});
ringToneOscs=[];
if(navigator.vibrate){try{navigator.vibrate(0);}catch(e){}}
}

function handleDirectMediaUpload(file){
if(!file)return;
if(st.ph5.length>=5){
alert(st.lang==="ar"?"الحد الأقصى 5 صور أو مقاطع فيديو":"Vous avez atteint la limite de 5 photos ou vidéos.");
return;
}
const isVid = file.type.startsWith("video/") || /\.(mp4|webm|mov|m4v)$/i.test(file.name);
if(isVid){
handleVideoUpload(file);
}else{
handlePhotoUpload(file);
}
}
const handleDirectPhotoUpload = handleDirectMediaUpload;

function handlePhotoUpload(file){
const reader=new FileReader();
reader.onload=function(ev){
const img=new Image();
img.onload=function(){
const maxDim=800;
let w=img.width,h=img.height;
if(w>maxDim||h>maxDim){
if(w>h){h=Math.round((h*maxDim)/w);w=maxDim;}
else{w=Math.round((w*maxDim)/h);h=maxDim;}
}
const canvas=document.createElement("canvas");
canvas.width=w;canvas.height=h;
const ctx=canvas.getContext("2d");
ctx.drawImage(img,0,0,w,h);
const dataUrl=canvas.toDataURL("image/jpeg",0.85);
st.ph5.push({o:dataUrl,p:dataUrl,isSelfie:false});
save();
syncProfileToSupabase();
render();
};
img.src=ev.target.result;
};
reader.readAsDataURL(file);
}

function handleVideoUpload(file){
const objUrl = URL.createObjectURL(file);
const video = document.createElement("video");
video.preload = "metadata";
video.src = objUrl;
video.muted = true;
video.playsInline = true;

let processed = false;
const finishUpload = (posterDataUrl, durSec) => {
if(processed) return;
processed = true;
const reader = new FileReader();
reader.onload = async function(ev){
const videoDataUrl = ev.target.result;
let finalVideoUrl = videoDataUrl;
if(sbClient){
try{
const ext = file.name.split('.').pop() || 'mp4';
const up = await uploadMediaToSupabase(videoDataUrl, `video_${st.u.id||'u'}_${Date.now()}.${ext}`, file.type || 'video/mp4');
if(up && !up.startsWith("data:")) finalVideoUrl = up;
}catch(err){console.warn("Video Supabase upload:", err);}
}
st.ph5.push({
o: finalVideoUrl,
p: finalVideoUrl,
poster: posterDataUrl,
isVideo: true,
duration: durSec || 10,
isSelfie: false
});
URL.revokeObjectURL(objUrl);
save();
syncProfileToSupabase();
render();
say(st.lang === "ar" ? "تمت إضافة الفيديو بنجاح (10 ثوانٍ) 🎥" : "Vidéo de 10s ajoutée avec succès 🎥");
};
reader.readAsDataURL(file);
};

video.onloadedmetadata = function(){
const dur = video.duration || 0;
if(dur > 10.5){
URL.revokeObjectURL(objUrl);
const msg = st.lang === "ar"
? `عذراً، يجب ألا تتجاوز مدة الفيديو 10 ثوانٍ (مدة هذا الفيديو: ${Math.round(dur)} ثانية). يرجى اختيار فيديو أقصر.`
: `La vidéo ne doit pas dépasser 10 secondes (durée : ${Math.round(dur)}s). Veuillez sélectionner une vidéo de 10 secondes maximum.`;
alert(msg);
return;
}
const seekTo = Math.min(1.0, dur > 1 ? dur / 2 : 0.2);
video.currentTime = seekTo;
};

video.onseeked = function(){
try{
const maxDim = 640;
let w = video.videoWidth || 480;
let h = video.videoHeight || 640;
if(w > maxDim || h > maxDim){
if(w > h){ h = Math.round((h * maxDim) / w); w = maxDim; }
else { w = Math.round((w * maxDim) / h); h = maxDim; }
}
const canvas = document.createElement("canvas");
canvas.width = w; canvas.height = h;
const ctx = canvas.getContext("2d");
ctx.drawImage(video, 0, 0, w, h);
const poster = canvas.toDataURL("image/jpeg", 0.85);
finishUpload(poster, Math.round(video.duration || 10));
}catch(err){
finishUpload("couple.jpg", Math.round(video.duration || 10));
}
};

video.onerror = function(){
URL.revokeObjectURL(objUrl);
alert(st.lang === "ar" ? "تعذر قراءة ملف الفيديو." : "Impossible de lire le fichier vidéo.");
};

setTimeout(()=>{
if(!processed && video.readyState >= 1){
finishUpload("couple.jpg", Math.round(video.duration || 10));
}
}, 3500);
}

ensureSelfieInPh5();
}
st.prem=dbProf.is_premium?1:0;
st.inc=!!dbProf.is_incognito||(Array.isArray(dbProf.hobbies)&&dbProf.hobbies.includes('__incognito__'));

ensureSelfieInPh5();
checkAndResetDailyLimits();
initIncomingRequests();

// Toujours ouvrir le formulaire d'inscription (Etape 2) pour laisser la main à l'utilisateur :
st.step=2;
st.savedStep=2;
say(x().gVerif||"Compte Google vérifié");
save();
go(2,"#nm");
render();
loadBlockedUsersFromSupabase();
loadProfilesFromSupabase();
loadLikesAndMatchesFromSupabase();
}

function initSocialAuthListener(){
if(!sbClient||authListenerAttached)return;
authListenerAttached=true;
try{
sbClient.auth.onAuthStateChange(async(evt,session)=>{
if(evt==="SIGNED_IN"||evt==="INITIAL_SESSION"||evt==="USER_UPDATED"){
await handleUserAuthSession(session);
}else if(evt==="SIGNED_OUT"){
await handleUserAuthSession(null);
}
});

sbClient.auth.getSession().then(async({data:{session}})=>{
if(session&&session.user){
await handleUserAuthSession(session);
}
}).catch(()=>{});
}catch(e){console.warn("Auth init error:",e)}
}
let realtimeChannel=null;
function initRealtimeDatabaseSync(){
if(!sbClient||!sbClient.channel||realtimeChannel)return;
try{
realtimeChannel=sbClient.channel('chari-realtime-sync')
.on('postgres_changes',{event:'*',schema:'public',table:'messages'},payload=>{
const m=payload.new||payload.old;
if(m){
const myId=st.u&&st.u.id;
const otherId=(m.sender_id===myId)?m.receiver_id:m.sender_id;
if(otherId){
loadMessagesFromSupabase(otherId);
}
if(st.tab==='m')render();
}
})
.on('postgres_changes',{event:'*',schema:'public',table:'likes'},payload=>{
loadLikesAndMatchesFromSupabase();
})
.on('postgres_changes',{event:'*',schema:'public',table:'user_blocks'},payload=>{
loadBlockedUsersFromSupabase();
})
.on('postgres_changes',{event:'*',schema:'public',table:'profiles'},payload=>{
loadProfilesFromSupabase();
})
.subscribe((status)=>{
console.log("Supabase Realtime status:",status);
});
}catch(e){console.warn("Realtime error:",e)}
}
initSocialAuthListener();
initRealtimeDatabaseSync();
loadBlockedUsersFromSupabase();
loadProfilesFromSupabase();
loadLikesAndMatchesFromSupabase();

setInterval(()=>{
if(st.tab==='m'&&st.chat){
loadMessagesFromSupabase(st.chat);
}
},2500);

setInterval(()=>{
if(st.step>=5){
loadBlockedUsersFromSupabase();
loadLikesAndMatchesFromSupabase();
if(st.tab==='d'){
loadProfilesFromSupabase();
}
}
},3500);

// Enregistrement du Service Worker pour installation PWA hors ligne
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
